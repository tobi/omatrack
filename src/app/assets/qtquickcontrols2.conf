; Control defaults for the whole application, including popups and menus that
; are created outside any window's QML tree (context menus, dialogs).
;
; Dense is Material's compact metric set: it takes ~8 px off every button,
; menu item, and list delegate, which is what an information-dense telemetry
; workstation needs. Setting it here rather than per-window keeps one source
; of truth and covers controls the QML never parents itself.

[Controls]
Style=Material

[Material]
Theme=Dark
Variant=Dense
