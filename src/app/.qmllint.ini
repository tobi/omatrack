// Omatrack qmllint settings. Everything the default profile leaves off is
// enabled here: `compiler` shows exactly what blocks qmlcachegen from
// compiling a binding ahead of time, which is the whole point of shipping a
// QML module. Warnings are informational — MaxWarnings=-1 keeps the build
// green; run `cmake --build build --target all_qmllint` to read them.
[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
AttachedPropertyReuse=warning
CompilerWarnings=warning
FunctionUsedBeforeDeclaration=warning
ImportFileSelector=warning
Shadow=warning
UseProperFunction=warning
Void=warning
