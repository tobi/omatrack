name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable tag to rebuild with packaging-only workflow repairs (empty = no publication)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  actions: read

env:
  OMATRACK_REQUIRE_IMAGE_TELEMETRY: 'ON'
  OMATRACK_RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Checkout workflow-version packaging tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            packaging
            scripts
      - name: Validate immutable release source and CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$OMATRACK_RELEASE_TAG" ]]; then
            [[ "$OMATRACK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$(awk '$1 == "project(omatrack" && $2 == "VERSION" {print $3; exit}' CMakeLists.txt)
            test "$OMATRACK_RELEASE_TAG" = "v$version"
            sha=$(git rev-parse HEAD)
            test "$sha" = "$(git rev-parse "refs/tags/$OMATRACK_RELEASE_TAG^{commit}")"
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"')
            test "$state" = completed:success
          fi
      - name: Read and validate release version
        shell: bash
        run: |
          version=$(sed -n 's/project(omatrack VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "OMATRACK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            binutils ccache clang-format libmpv-dev libyaml-dev libzstd-dev ninja-build \
            pkg-config zsync libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
          ort_root=$(.release-workflow/scripts/fetch-onnxruntime.sh linux-x64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            release-cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: release-ccache-${{ runner.os }}-
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_INSTALL_PREFIX=/usr
          -DOMATRACK_STATIC_GNU_RUNTIME=ON
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Install application tree
        run: DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build-ci
      - name: Download pinned AppImage deployment tools
        run: |
          # Tagged releases, not the moving `continuous` asset: that one is
          # rebuilt upstream every few weeks and the pinned hash broke the
          # 1.5.0 release the day after it was taken.
          mkdir -p release-tools
          curl --fail --location --output release-tools/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --output release-tools/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  release-tools/linuxdeploy.AppImage' | sha256sum --check
          echo '15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  release-tools/linuxdeploy-plugin-qt.AppImage' | sha256sum --check
          chmod +x release-tools/linuxdeploy.AppImage release-tools/linuxdeploy-plugin-qt.AppImage
      - name: Build AppImage
        env:
          LINUXDEPLOY_PLUGIN_QT: ${{ github.workspace }}/release-tools/linuxdeploy-plugin-qt.AppImage
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/app
          # Final asset names so the .zsync Filename matches the GitHub
          # download and the in-app updater can find SHA256SUMS + AppImage.
          LDAI_OUTPUT: Omatrack-${{ env.OMATRACK_RELEASE_VERSION }}-linux-x86_64.AppImage
          LINUXDEPLOY_OUTPUT_VERSION: ${{ env.OMATRACK_RELEASE_VERSION }}
          LDAI_VERSION: ${{ env.OMATRACK_RELEASE_VERSION }}
          UPDATE_INFORMATION: gh-releases-zsync|tobi|omatrack|latest|Omatrack-*-linux-x86_64.AppImage.zsync
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|tobi|omatrack|latest|Omatrack-*-linux-x86_64.AppImage.zsync
        run: |
          artifact="Omatrack-${OMATRACK_RELEASE_VERSION}-linux-x86_64.AppImage"
          mapfile -t portable_libraries < <(
            .release-workflow/packaging/linux/collect-portable-libraries.sh \
              AppDir/usr/bin/omatrack
          )
          deploy_arguments=(
            --appdir AppDir
            --desktop-file packaging/linux/io.github.tobi.omatrack.desktop
            --icon-file assets/omatrack.svg
            --executable AppDir/usr/bin/omatrack
            --plugin qt
            --output appimage
          )
          for library in "${portable_libraries[@]}"; do
            deploy_arguments+=(--library "$library")
          done
          release-tools/linuxdeploy.AppImage "${deploy_arguments[@]}"
          test -f "$artifact"
          test -f "${artifact}.zsync"
          chmod +x "$artifact"
          "./$artifact" --appimage-version
          # Type 2 AppImages store the GitHub zsync pointer in .upd_info.
          # Without it, later AppImages cannot find this channel.
          readelf -p .upd_info "$artifact" | grep -F \
            'gh-releases-zsync|tobi|omatrack|latest|Omatrack-*-linux-x86_64.AppImage.zsync'
          grep -E "^(Filename|Name): ${artifact}$" "${artifact}.zsync"
          mkdir appimage-audit
          (
            cd appimage-audit
            "../$artifact" --appimage-extract >/dev/null
          )
          .release-workflow/packaging/linux/verify-bundle.sh appimage-audit/squashfs-root
          # The headless commands run before Qt starts: this proves the
          # bundled binary resolves its libraries without a display.
          set +e
          cli_output=$(
            appimage-audit/squashfs-root/usr/bin/omatrack parse 2>&1
          )
          cli_status=$?
          set -e
          test "$cli_status" -eq 2
          grep -q '^usage:' <<<"$cli_output"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            Omatrack-${{ env.OMATRACK_RELEASE_VERSION }}-linux-x86_64.AppImage
            Omatrack-${{ env.OMATRACK_RELEASE_VERSION }}-linux-x86_64.AppImage.zsync
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Checkout workflow-version packaging tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            packaging
            scripts
      - name: Validate immutable release source and CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$OMATRACK_RELEASE_TAG" ]]; then
            [[ "$OMATRACK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$(awk '$1 == "project(omatrack" && $2 == "VERSION" {print $3; exit}' CMakeLists.txt)
            test "$OMATRACK_RELEASE_TAG" = "v$version"
            sha=$(git rev-parse HEAD)
            test "$sha" = "$(git rev-parse "refs/tags/$OMATRACK_RELEASE_TAG^{commit}")"
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"')
            test "$state" = completed:success
          fi
      - name: Read and validate release version
        shell: bash
        run: |
          version=$(sed -n 's/project(omatrack VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "OMATRACK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install native dependencies
        run: |
          brew install ccache clang-format dylibbundler libyaml mpv ninja pkg-config zstd
          ort_root=$(.release-workflow/scripts/fetch-onnxruntime.sh osx-arm64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            release-cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: release-ccache-${{ runner.os }}-
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage"
          -DCMAKE_INSTALL_DOCDIR="Omatrack.app/Contents/Resources/doc"
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Install and bundle application
        timeout-minutes: 10
        run: |
          test -f "${ONNXRUNTIME_ROOT:?}/lib/libonnxruntime.dylib"
          mkdir -p build-ci/Omatrack.app/Contents/Frameworks
          dylibbundler \
            --bundle-deps \
            --fix-file build-ci/Omatrack.app/Contents/MacOS/Omatrack \
            --dest-dir build-ci/Omatrack.app/Contents/Frameworks \
            --install-path '@executable_path/../Frameworks/' \
            --ignore "$QT_ROOT_DIR" \
            --search-path "$ONNXRUNTIME_ROOT/lib" \
            --overwrite-files <<< 'quit'
          cmake --install build-ci
          test -f stage/Omatrack.app/Contents/Resources/doc/LICENSE
          test -f stage/Omatrack.app/Contents/Resources/doc/onnxruntime/LICENSE
          test -f stage/Omatrack.app/Contents/Resources/doc/onnxruntime/ThirdPartyNotices.txt
          .release-workflow/packaging/macos/verify-bundle.sh stage/Omatrack.app
          codesign --force --deep --sign - stage/Omatrack.app
          codesign --verify --deep --strict stage/Omatrack.app
      - name: Build disk image
        run: |
          artifact="Omatrack-${OMATRACK_RELEASE_VERSION}-macOS-arm64.dmg"
          hdiutil create \
            -volname "Omatrack ${OMATRACK_RELEASE_VERSION}" \
            -srcfolder stage/Omatrack.app \
            -format UDZO \
            -ov "$artifact"
          hdiutil verify "$artifact"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: Omatrack-${{ env.OMATRACK_RELEASE_VERSION }}-macOS-arm64.dmg
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Checkout workflow-version packaging tools
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: |
            packaging
            scripts
      - name: Validate immutable release source and CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$OMATRACK_RELEASE_TAG" ]]; then
            [[ "$OMATRACK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$(awk '$1 == "project(omatrack" && $2 == "VERSION" {print $3; exit}' CMakeLists.txt)
            test "$OMATRACK_RELEASE_TAG" = "v$version"
            sha=$(git rev-parse HEAD)
            test "$sha" = "$(git rev-parse "refs/tags/$OMATRACK_RELEASE_TAG^{commit}")"
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] | "\(.status):\(.conclusion)"')
            test "$state" = completed:success
          fi
      - name: Install MSYS2 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            p7zip
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-rust
      - name: Select native ONNX Runtime SDK
        run: |
          ort_root=$(cygpath -m /ucrt64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$(cygpath -m "$model_file")" >> "$GITHUB_ENV"
      - name: Read and validate release version
        run: |
          version=$(sed -n 's/project(omatrack VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "OMATRACK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            release-cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: release-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: release-ccache-${{ runner.os }}-
      - name: Configure
        run: >-
          cmake --preset ci
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage"
          -DOMATRACK_STATIC_GNU_RUNTIME=ON
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      - name: Install application tree
        run: |
          cmake --install build-ci

          # Qt deploys its own runtime and QML imports. Close over the remaining
          # MinGW dependencies (mpv, yaml, and compiler runtimes) recursively.
          # The install tree is flat: executables and their load-time DLLs sit
          # at the stage root, so collected dependencies land there too.
          source .release-workflow/packaging/windows/runtime-policy.sh
          mapfile -d '' binaries < <(
            find stage -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0
          )
          declare -A inspected=()
          declare -A bundled=()
          for binary in "${binaries[@]}"; do
            filename=${binary##*/}
            bundled[${filename,,}]=1
          done
          unresolved=0
          index=0
          while ((index < ${#binaries[@]})); do
            binary=${binaries[index++]}
            if [[ -n "${inspected[$binary]+present}" ]]; then
              continue
            fi
            inspected[$binary]=1

            while IFS= read -r dependency; do
              [[ -n "$dependency" ]] || continue
              if [[ "${dependency,,}" == api-ms-win-* ||
                    "${dependency,,}" == ext-ms-win-* ]]; then
                continue
              fi
              dependency_key=${dependency,,}
              if [[ -n "${bundled[$dependency_key]+present}" ]]; then
                continue
              fi
              if [[ -f "/ucrt64/bin/$dependency" ]]; then
                destination="stage/$dependency"
                cp "/ucrt64/bin/$dependency" "$destination"
                binaries+=("$destination")
                bundled[$dependency_key]=1
                continue
              fi
              if omatrack_windows_system_library "$dependency"; then
                continue
              fi
              echo "Unresolved runtime dependency: $dependency (required by $binary)" >&2
              unresolved=1
            done < <(objdump -p "$binary" | awk '/DLL Name:/{print $3}')
          done
          ((unresolved == 0))
          .release-workflow/packaging/windows/verify-bundle.sh stage
          test -f stage/omatrack.exe
          test -f stage/qt.conf
          set +e
          cli_output=$(stage/omatrack.exe parse 2>&1)
          cli_status=$?
          set -e
          test "$cli_status" -eq 2
          grep -q '^usage:' <<<"$cli_output"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Velopack installer
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.0
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk pack `
            --packId io.github.tobi.omatrack `
            --packVersion $env:OMATRACK_RELEASE_VERSION `
            --packDir stage `
            --mainExe omatrack.exe `
            --icon assets/omatrack.ico `
            --packTitle Omatrack `
            --shortcuts StartMenuRoot `
            --instLocation PerUser `
            --noPortable `
            --skipVeloAppCheck `
            --outputDir velopack-out
          Get-ChildItem velopack-out | Format-Table Name, Length
          $setup = Get-ChildItem velopack-out -Filter *-win-Setup.exe
          if (-not $setup) {
            throw "Velopack Setup.exe was not produced"
          }
          if (-not (Get-ChildItem velopack-out -Filter *-full.nupkg)) {
            throw "Velopack full nupkg was not produced"
          }
          # The installer is the user-facing asset: name it like the AppImage
          # and the dmg. The nupkg keeps Velopack's own {packId}-{version}
          # naming because Update.exe and releases.win.json depend on it.
          Move-Item $setup.FullName `
            "velopack-out/Omatrack-$env:OMATRACK_RELEASE_VERSION-windows-x86_64-Setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            velopack-out/Omatrack-*-windows-x86_64-Setup.exe
            velopack-out/*-full.nupkg
            velopack-out/releases.win.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: |
          shopt -s nullglob
          installables=(
            Omatrack-*-linux-x86_64.AppImage
            Omatrack-*-windows-x86_64-Setup.exe
            io.github.tobi.omatrack-*-full.nupkg
            Omatrack-*-macOS-arm64.dmg
          )
          test "${#installables[@]}" -eq 4
          sha256sum "${installables[@]}" > SHA256SUMS.txt
          # In-app updaters resolve these hashes. A missing line would
          # download and then refuse to install.
          grep -E '^[0-9a-f]{64}  Omatrack-.+-linux-x86_64\.AppImage$' \
            SHA256SUMS.txt
          grep -E '^[0-9a-f]{64}  io.github.tobi.omatrack-.+-full\.nupkg$' \
            SHA256SUMS.txt
          grep -E '^[0-9a-f]{64}  Omatrack-.+-windows-x86_64-Setup\.exe$' \
            SHA256SUMS.txt
          grep -E '^[0-9a-f]{64}  Omatrack-.+-macOS-arm64\.dmg$' \
            SHA256SUMS.txt
          test -f Omatrack-*-linux-x86_64.AppImage.zsync
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Omatrack ${{ env.OMATRACK_RELEASE_TAG }}
          tag_name: ${{ env.OMATRACK_RELEASE_TAG }}
          body: |
            Portable Linux AppImages, the Windows Velopack installer, and
            macOS apps can check this release from the header and update
            themselves after verifying SHA256SUMS.txt. Windows installs
            per-user (no UAC) and applies updates through Update.exe.

            Downloads are unsigned development builds. The macOS image is
            ad-hoc signed but is not Apple-notarized.
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
