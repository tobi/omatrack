name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMATRACK_REQUIRE_IMAGE_TELEMETRY: 'ON'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            ccache clang-format libmpv-dev libyaml-dev libzstd-dev ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
          ort_root=$(scripts/fetch-onnxruntime.sh linux-x64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          brew install ccache clang-format libyaml mpv ninja pkg-config zstd
          ort_root=$(scripts/fetch-onnxruntime.sh osx-arm64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - name: Install MSYS2 toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-rust
      - name: Select native ONNX Runtime SDK
        run: |
          ort_root=$(cygpath -m /ucrt64)
          echo "ONNXRUNTIME_ROOT=$ort_root" >> "$GITHUB_ENV"
          model_file=$(scripts/fetch-reader-test-model.sh)
          echo "OMATRACK_GAUGE_SMOKE_MODEL=$(cygpath -m "$model_file")" >> "$GITHUB_ENV"
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ci/cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('third_party/motorsport-telemetry/Cargo.lock') }}-
            cargo-${{ runner.os }}-
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
