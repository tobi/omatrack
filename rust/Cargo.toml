# Omatrack 2.0: the Rust/GPUI workstation. The CLI is regression-tested
# against a frozen baseline (parity/run.sh).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "2.0.0-dev"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/tobi/omatrack"

[workspace.dependencies]
# The gpui stack is yanked in the index; see scripts/seed-cargo-lock.sh.
# The component facade (gpui_kit::component = gpui-component 0.6.6) is the
# component system. Omarchy desktop themes are bridged by omatrack-ui::theme.
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets", "component"] }

# Vendor parsers, all pinned to one upstream revision.
# omatrack-core/build.rs derives the converter generation from the rev below.
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }
motorsport-track-atlas = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "cac837feb12fe112bd85a159e2d6d49543647313" }

# Parity requirement: unify float_roundtrip into the upstream MTJ reader, as
# the retired C++ bridge did, so parsed f64 values match the baseline.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
blake3 = "=1.5.5"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
image = { version = "0.25", default-features = false }
async-channel = "2"
smallvec = "1"
walkdir = "2"
libc = "0.2"
pkg-config = "0.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
libmpv2-sys = "=4.0.1"
notify = "=7.0.0"
toml = "=0.8.23"
tempfile = "=3.27.0"
jiff = "=0.2.37"

omatrack-core = { path = "crates/omatrack-core" }
omatrack-cli = { path = "crates/omatrack-cli" }
omatrack-library = { path = "crates/omatrack-library" }
omatrack-trace = { path = "crates/omatrack-trace" }
omatrack-ui = { path = "crates/omatrack-ui" }
mpv-player = { path = "crates/mpv-player" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unknown_lints = "deny"
renamed_and_removed_lints = "deny"
unfulfilled_lint_expectations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# These apply to ordinary `cargo clippy` too, not just CI. Keep group
# priorities below individual lints. See CLIPPY.md before adding exceptions.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Restrictions that catch common generated-code shortcuts. Do not enable
# the entire restriction group: some of its rules contradict one another.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
panic = "deny"
rest_pat_in_fully_bound_structs = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"

# Floating-point operation order is part of the byte-parity contract.
# FMA/radian/power rewrites need a deliberate numerical change and rebaseline.
suboptimal_flops = "allow"
imprecise_flops = "allow"
# GPUI foreground futures intentionally hold !Send entities and windows;
# background_spawn separately enforces Send at its type boundary.
future_not_send = "allow"
# Framework callbacks use consistent mutable Window/Context signatures even
# when a particular implementation only reads them.
needless_pass_by_ref_mut = "allow"
# Const API commitments and annotations on every reader are design choices.
# Consuming builders are still checked by return_self_not_must_use.
missing_const_for_fn = "allow"
must_use_candidate = "allow"
# Explicit crate visibility is required by unreachable_pub; this nursery
# lint recommends the opposite spelling for items inside private modules.
redundant_pub_crate = "allow"
# Explicit branches keep UI fallbacks readable and avoid competing closures
# borrowing the same GPUI context. Both forms are equally checked and lazy.
option_if_let_else = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
