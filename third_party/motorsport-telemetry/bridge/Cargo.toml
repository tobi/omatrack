[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "35e42a26920bab4bac0cde3b999660aaa2024f3c" }
