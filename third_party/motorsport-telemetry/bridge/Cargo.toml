[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
# Unify this feature into the upstream MTJ reader. Its default float parser can
# move a shortest-decimal f64 by an ULP, making identical cached observations
# conflict at the next merge. Keep equality strict; parse the stored value exactly.
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "c1ac439d99d924be5e6663e15abd335c56b30bc0" }
