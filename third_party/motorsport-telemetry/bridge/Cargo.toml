[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "1b1e6c562cf1e7aaacd9fbfa575f5bf3a9e4f360" }
