[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "71d92d3b65537b6ab87c702d7219954fb0f52b16" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "71d92d3b65537b6ab87c702d7219954fb0f52b16" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "71d92d3b65537b6ab87c702d7219954fb0f52b16" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "71d92d3b65537b6ab87c702d7219954fb0f52b16" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "71d92d3b65537b6ab87c702d7219954fb0f52b16" }
