[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "843e2c500201acf00c813e23b3db2a8dd3b4f830" }
