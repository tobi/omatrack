[package]
name = "omatrack-bridge"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "C ABI bridge exposing motorsport-telemetry-rs to Omatrack"

[lib]
name = "omatrack_bridge"
crate-type = ["staticlib"]

[dependencies]
aim-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
blake3 = "=1.5.5"
cosworth-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
motec-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
motorsport-telemetry-core = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
racelogic-telemetry = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
telemetry-format = { git = "https://github.com/tobi/motorsport-telemetry-rs", rev = "f7373f29e000663c57800f0e22071ae7e09b0889" }
